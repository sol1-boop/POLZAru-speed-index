<!-- templates/metrics.html -->
{% extends 'base.html' %}

{% block title %}График для {{ url }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">График для {{ url }}</h1>
<div class="mb-4">
    <label for="chartType" class="mr-2">Тип графика:</label>
    <select id="chartType" class="border rounded p-1">
        <option value="line">Линейный</option>
        <option value="bar">Столбчатый</option>
    </select>
</div>
<canvas id="metricsChart" class="w-full max-h-[500px]"></canvas>
<p class="mt-6"><a href="{{ url_for('index') }}" class="text-blue-600 hover:underline">Назад к списку доменов</a></p>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const timestamps = {{ timestamps|tojson }};
    const fcpValues = {{ fcp_values|tojson }};
    const lcpValues = {{ lcp_values|tojson }};
    const ttfbValues = {{ ttfb_values|tojson }};
    const tbtValues = {{ tbt_values|tojson }};
    const siValues = {{ si_values|tojson }};

    const datasets = [
        {
            label: 'FCP',
            data: fcpValues,
            borderColor: 'rgba(54, 162, 235, 1)',
            backgroundColor: 'rgba(54, 162, 235, 0.2)',
            fill: false
        },
        {
            label: 'LCP',
            data: lcpValues,
            borderColor: 'rgba(153, 102, 255, 1)',
            backgroundColor: 'rgba(153, 102, 255, 0.2)',
            fill: false
        },
        {
            label: 'TTFB',
            data: ttfbValues,
            borderColor: 'rgba(255, 159, 64, 1)',
            backgroundColor: 'rgba(255, 159, 64, 0.2)',
            fill: false
        },
        {
            label: 'TBT',
            data: tbtValues,
            borderColor: 'rgba(255, 99, 132, 1)',
            backgroundColor: 'rgba(255, 99, 132, 0.2)',
            fill: false
        },
        {
            label: 'Speed Index',
            data: siValues,
            borderColor: 'rgba(201, 203, 207, 1)',
            backgroundColor: 'rgba(201, 203, 207, 0.2)',
            fill: false
        }
    ];

    const ctx = document.getElementById('metricsChart');
    let currentChart = null;

    function renderChart(type) {
        if (currentChart) {
            currentChart.destroy();
        }
        currentChart = new Chart(ctx, {
            type: type,
            data: {
                labels: timestamps,
                datasets: datasets
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Время'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Значение (секунды)'
                        }
                    }
                }
            }
        });
    }

    const chartTypeSelect = document.getElementById('chartType');
    chartTypeSelect.addEventListener('change', function() {
        renderChart(this.value);
    });

    renderChart(chartTypeSelect.value);
</script>
{% endblock %}
