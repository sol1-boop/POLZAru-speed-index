<!-- templates/metrics.html -->
{% extends 'base.html' %}

{% block title %}Метрики для {{ url }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Метрики для {{ url }}</h1>
<div class="space-y-6">
    <canvas id="fcpChart" class="w-full"></canvas>
    <canvas id="lcpChart" class="w-full"></canvas>
    <canvas id="ttfbChart" class="w-full"></canvas>
    <canvas id="tbtChart" class="w-full"></canvas>
    <canvas id="siChart" class="w-full"></canvas>
</div>
<p class="mt-6"><a href="{{ url_for('index') }}" class="text-blue-600 hover:underline">Назад к списку доменов</a></p>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const timestamps = {{ timestamps|tojson }};
    const fcpValues = {{ fcp_values|tojson }};
    const lcpValues = {{ lcp_values|tojson }};
    const ttfbValues = {{ ttfb_values|tojson }};
    const tbtValues = {{ tbt_values|tojson }};
    const siValues = {{ si_values|tojson }};

    function createChart(ctx, label, data) {
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: timestamps,
                datasets: [{
                    label: label,
                    data: data,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    fill: false,
                    tension: 0.4,
                    cubicInterpolationMode: 'monotone',
                    pointRadius: 3,
                    pointHoverRadius: 5
                }]
            },
            options: {
                scales: {
                    x: {
                        display: true,
                        title: {
                            display: true,
                            text: 'Время'
                        }
                    },
                    y: {
                        display: true,
                        title: {
                            display: true,
                            text: 'Значение (секунды)'
                        }
                    }
                }
            }
        });
    }

    createChart(document.getElementById('fcpChart'), 'FCP', fcpValues);
    createChart(document.getElementById('lcpChart'), 'LCP', lcpValues);
    createChart(document.getElementById('ttfbChart'), 'TTFB', ttfbValues);
    createChart(document.getElementById('tbtChart'), 'TBT', tbtValues);
    createChart(document.getElementById('siChart'), 'Speed Index', siValues);
</script>
{% endblock %}
