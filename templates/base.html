<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моё приложение{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.4.1/flowbite.min.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900">
    <header class="bg-gray-800">
        <nav class="container mx-auto flex space-x-4 p-4 text-white">
            <a href="{{ url_for('index') }}" class="hover:underline">Главная</a>
            <a href="{{ url_for('dashboard') }}" class="hover:underline">Дашборд</a>
            <a href="{{ url_for('auth_bp.settings') }}" class="hover:underline">Настройки</a>
        </nav>
    </header>
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.4.1/flowbite.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
