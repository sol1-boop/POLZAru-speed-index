<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моё приложение{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Главная</a></li>
                <li><a href="{{ url_for('dashboard') }}">Дашборд</a></li>
                <li><a href="{{ url_for('auth_bp.settings') }}">Настройки</a></li>
            </ul>
        </nav>
    </header>
    {% block content %}{% endblock %}
    <!-- Подключение основных скриптов в конце body -->
    {% block scripts %}{% endblock %}
</body>
</html>
