<!-- templates/login.html -->
{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-4">Вход в систему</h1>
    {% if error %}
        <p class="text-red-600 mb-4">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('auth_bp.login') }}" class="space-y-4">
        <div>
            <label for="username" class="block mb-1">Логин:</label>
            <input type="text" id="username" name="username" required
                   class="w-full border border-gray-300 rounded p-2" />
        </div>
        <div>
            <label for="password" class="block mb-1">Пароль:</label>
            <input type="password" id="password" name="password" required
                   class="w-full border border-gray-300 rounded p-2" />
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit"
                class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
            Войти
        </button>
    </form>
</div>
{% endblock %}
